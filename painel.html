<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sudeste RP — Painel da Staff</title><style>body{margin:0;background:#030509;color:#f5f8ff;font-family:Inter,system-ui,Arial}.wrap{width:min(1200px,94%);margin:auto;padding:35px 0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.muted{color:#8995a8}.login,.card{background:#090e16;border:1px solid #1b2839;border-radius:18px;padding:25px;box-shadow:0 20px 70px #0008}input,select,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #26364b;background:#060a10;color:#fff}input{width:100%;box-sizing:border-box;margin:10px 0 15px}.primary{background:#1683ff;border:0;font-weight:800;cursor:pointer}.filters{display:flex;gap:10px;margin-bottom:18px}.table{overflow:auto}.row{display:grid;grid-template-columns:130px 1fr 100px 150px 190px;gap:12px;padding:14px;border-bottom:1px solid #172333;align-items:center}.head{font-size:11px;color:#7f8da2;font-weight:800;text-transform:uppercase}.badge{padding:6px 9px;border-radius:999px;background:#18202c;font-size:11px;display:inline-block}.actions button{margin-right:5px;cursor:pointer}.approve{background:#0e6b43}.reject{background:#8b2634}.error{color:#ff9da8;margin:10px 0}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px}.modal .card{width:min(800px,100%);max-height:90vh;overflow:auto}@media(max-width:750px){.row{grid-template-columns:1fr}.head{display:none}.filters{flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><h1>SUDESTE RP</h1><div class="muted">Painel da Staff • Whitelist</div></div><button id="logout" style="display:none">Sair</button></div><section id="login" class="login"><h2>Acesso da Staff</h2><p class="muted">Digite a senha configurada no Render.</p><input id="password" type="password" placeholder="Senha do painel"><button class="primary" id="enter">Entrar</button><div id="loginError" class="error"></div></section><section id="app" style="display:none"><div class="filters"><select id="filter"><option value="">Todas</option><option>Em análise</option><option>Aprovada</option><option>Reprovada</option></select><button class="primary" id="refresh">Atualizar</button></div><div class="card table"><div class="row head"><div>Protocolo</div><div>Jogador</div><div>Status</div><div>Data</div><div>Ações</div></div><div id="rows"></div></div></section></main><div id="modal" class="modal"><div class="card"><button id="close" style="float:right">Fechar</button><h2 id="mtitle"></h2><div id="mdetail"></div></div></div><script>const login=document.getElementById('login'),app=document.getElementById('app'),rows=document.getElementById('rows'),filter=document.getElementById('filter');async function api(url,opt={}){const r=await fetch(url,opt);if(r.status===401)throw new Error('AUTH');const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Erro');return j}async function load(){try{const j=await api('/api/staff/wl?status='+encodeURIComponent(filter.value));rows.innerHTML=j.items.map(x=>`<div class="row"><div><b>${x.protocol}</b></div><div>${esc(x.nome)}<br><span class="muted">ID ${esc(x.idlib)} • Discord ${esc(x.discord)}</span></div><div><span class="badge">${esc(x.status)}</span></div><div class="muted">${new Date(x.created_at).toLocaleString('pt-BR')}</div><div class="actions"><button onclick="detail('${x.protocol}')">Ver</button>${x.status==='Em análise'?`<button class="approve" onclick="review('${x.protocol}','Aprovada')">Aprovar</button><button class="reject" onclick="review('${x.protocol}','Reprovada')">Reprovar</button>`:''}</div></div>`).join('')||'<div style="padding:25px" class="muted">Nenhuma WL encontrada.</div>'}catch(e){if(e.message==='AUTH')logout();else rows.innerHTML='<div class="error">Erro ao carregar WLs.</div>'}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function review(protocol,status){const reason=status==='Reprovada'?prompt('Motivo da reprovação:'):'';if(status==='Reprovada'&&reason===null)return;try{await api('/api/staff/wl/'+encodeURIComponent(protocol),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,reason})});await load()}catch(e){alert('Não foi possível atualizar a WL.')}}async function detail(protocol){try{const x=(await api('/api/staff/wl/'+encodeURIComponent(protocol))).item;document.getElementById('mtitle').textContent=x.protocol+' — '+x.status;document.getElementById('mdetail').innerHTML='<p><b>Nome:</b> '+esc(x.nome)+'</p><p><b>ID:</b> '+esc(x.idlib)+'<br><b>Discord:</b> '+esc(x.discord)+'<br><b>Idade:</b> '+x.idade+'<br><b>Experiência:</b> '+esc(x.experiencia)+'</p>'+[['Roleplay',x.roleplay],['Motivo',x.motivo],['RDM',x.rdm],['VDM',x.vdm],['MG',x.mg],['Rendição',x.situacao]].map(a=>'<p><b>'+a[0]+':</b><br>'+esc(a[1])+'</p>').join('')+(x.review_reason?'<p><b>Observação:</b><br>'+esc(x.review_reason)+'</p>':'');document.getElementById('modal').style.display='flex'}catch(e){alert('WL não encontrada.')}}document.getElementById('enter').onclick=async()=>{try{await api('/api/staff/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});login.style.display='none';app.style.display='block';document.getElementById('logout').style.display='block';load()}catch(e){document.getElementById('loginError').textContent='Senha incorreta.'}};function logout(){location.reload()}document.getElementById('logout').onclick=logout;document.getElementById('refresh').onclick=load;filter.onchange=load;document.getElementById('close').onclick=()=>document.getElementById('modal').style.display='none';</script></body></html>
